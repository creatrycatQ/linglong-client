name: linglong_worker_flutter
description: "Linglong eSports Worker Client - Flutter Native Edition"
publish_to: 'none'
version: 1.0.2+102

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  shared_preferences: ^2.2.2
  audioplayers: ^6.0.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand.png
    - assets/mascot.webp
    - assets/tray.png
